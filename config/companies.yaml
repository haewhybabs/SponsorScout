  # Added 2026-11-05: regulators/central bank - legally separate from core Civil
  # Service (not subject to its UK/Commonwealth-nationality eligibility rule), and
  # known Skilled Worker sponsors. Structured, non-leetcode interview process.
  - name: Financial Conduct Authority
    ats: workday
    slug: "fca:3:FCA_Careers"
  - name: Ofcom
    ats: workday
    slug: "ofcom:3:Ofcom_Careers"
  - name: NESO
    ats: workday
    slug: "neso:103:Careers"

  # Added 2026-11-06: large non-tech UK sponsors with real internal engineering teams -
  # the user's idea was to look beyond pure tech/fintech companies, broadened to any large
  # UK sponsor. searchTerms scopes the Workday query server-side rather than fetching every
  # global posting (GSK alone has ~978 total postings worldwide, most not UK/not engineering).
  - name: John Lewis Partnership
    ats: workday
    slug: "jlp:3:JLPjobs_careers"
    searchTerms: ["software engineer", "software developer"]
  - name: Lloyds Banking Group
    ats: workday
