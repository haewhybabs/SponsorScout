# Company careers sources via ATS APIs.
# ats: greenhouse | lever | ashby | workable | smartrecruiters | teamtailor
# slug: the identifier used in that ATS's public API URL.
# Verified live against the real endpoints on 2026-11-04 (see §5 of SPEC.md).
# Note: the Greenhouse slug "wise" belongs to an unrelated US company ("Wise
# Worksite Field Sales"), not the fintech Wise.com - Wise.com actually runs on
# SmartRecruiters (company id "Wise"), which is a Phase 2 adapter. Swapped for
# Trustpilot here; revisit Wise via SmartRecruiters once that adapter exists.
companies:
  - name: Monzo
    ats: greenhouse
    slug: monzo
  - name: Deliveroo
    ats: greenhouse
    slug: deliveroo
  - name: GoCardless
    ats: greenhouse
    slug: gocardless
