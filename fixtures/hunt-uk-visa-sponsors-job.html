<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Director, AI & Machine Learning","description":"\u003ch2>\u003cb>Who are we?\u003c/b>\u003c/h2>\u003cp>\u003cbr/>At Finastra, we’re a global leader in financial services software, dedicated to expanding access to financial services and shaping what’s next for the industry. Our technology powers mission‑critical solutions across Lending, Payments and Universal Banking, supporting over 7,000 customers, including 80% of the world’s top 50 banks, in more than 110 countries. \u003c/p>\n\u003ch2>\u003cb>Disclaimer:\u003c/b>\u003c/h2>\u003cbr/>\u003cp>Finastra has signed an agreement to sell its Universal Banking business to Pollen Street Capital, with completion expected end 2026 / early 2027, subject to consultation and customary closing conditions. Upon completion, this role is expected to transition to the standalone Universal Banking business, creating opportunities to support its future growth and success.\u003c/p>\u003cbr/>\u003cp>\u003cb>The opportunity\u003c/b>\u003c/p>\u003cbr/>\u003cp>We are seeking a deeply technical Director of AI and Machine Learning to lead the engineering organisation’s AI capability. This role will translate product-led AI strategy into scalable architecture, engineering design and delivery, ensuring that AI can be consumed responsibly, efficiently and measurably across the software development lifecycle. \u003c/p>\u003cbr/>\u003cp>Acting as the technical authority for AI, machine learning and associated data considerations, the Director will guide technology choices, establish the AI engineering estate and help the organisation navigate a period of transition. \u003c/p>\u003cbr/>\u003cp>The role combines hands-on technical credibility with strategic leadership, cross-functional influence and a strong understanding of enterprise software engineering. \u003c/p>\u003cbr/>\u003cp>\u003cb>What you will do:\u003c/b>\u003c/p>\u003cbr/>\u003cul>\u003cli>Own enterprise AI reference architecture , engineering patterns and technology standards along with the technical AI and machine learning strategy for Engineering, aligned with product priorities and the wider technology direction. \u003c/li>\u003cli>Establish reusable architectural patterns covering model access, orchestration, retrieval, data access, security, observability and integration with enterprise applications. \u003c/li>\u003cli>Define when teams should build, buy, reuse or consume AI capabilities and platforms. \u003c/li>\u003cli>Translate AI product ambitions into practical architecture, engineering designs, delivery patterns and measurable outcomes across the SDLC. \u003c/li>\u003cli>Establish and evolve the AI engineering estate, ensuring the organisation has the capabilities, platforms and operating model required to deliver effectively. \u003c/li>\u003cli>Assess AI technologies, models and tooling, monitor market developments and recommend the most appropriate options for enterprise use cases. \u003c/li>\u003cli>Define approaches for cloud-based MLOps, model deployment, monitoring, scalability and operational management. \u003c/li>\u003cli>Provide technical leadership on data strategy, including data inputs and outputs, data residency and the data foundations required for engineering-led AI use cases. \u003c/li>\u003cli>Advise on AI consumption economics and model-cost considerations, including usage-based and seat-based pricing structures. \u003c/li>\u003cli>Partner closely with Product, Architecture, Engineering and other senior stakeholders to ensure AI solutions deliver intended customer and business outcomes. \u003c/li>\u003cli>Build and lead a specialist capability, initially with a small number of direct reports and potentially adding machine-learning and data-science expertise as needs develop. \u003c/li>\u003cli>Create clear communication and governance across functions, bringing senior stakeholders with you through technical choices, trade-offs and delivery priorities\u003c/li>\u003cli>Lead the technical approach for Generative AI and agentic AI, including LLM selection, orchestration, RAG, tool use, agent design and evaluation. \u003c/li>\u003cli>Drive reusable platform capabilities for model access, prompt management, RAG, evaluation, observability, governance and cost management. \u003c/li>\u003cli>Prevent duplication by establishing common AI services and reusable engineering components across product teams. \u003c/li>\u003c/ul>\u003cp>\u003cb>What success looks like:\u003c/b>\u003c/p>\u003cbr/>\u003cul>\u003cli>A coherent AI engineering estate and roadmap are established for the new organisation. \u003c/li>\u003c/ul>\u003cul>\u003cli>Engineering can reliably deliver the product AI strategy through scalable architecture, tooling and SDLC practices. \u003c/li>\u003c/ul>\u003cul>\u003cli>AI technology and model choices are grounded in technical fit, operational requirements, data considerations and total cost of consumption. \u003c/li>\u003c/ul>\u003cul>\u003cli>Product and Engineering operate with clear alignment on priorities, accountabilities and customer impact. \u003c/li>\u003c/ul>\u003cul>\u003cli>A strong specialist team and partner network are developed around AI, machine learning and data science. \u003c/li>\u003c/ul>\u003cbr/>\u003cp>\u003cb>What you will bring:\u003c/b>\u003c/p>\u003cbr/>\u003cul>\u003cli>Highly experienced across software engineering, architecture and enterprise SDLC environments. \u003c/li>\u003cli>Approximately four to five years of substantive experience applying AI and machine learning in an engineering or enterprise software context. \u003c/li>\u003cli>Deep, current knowledge of AI and machine-learning technologies, model options, tooling trends and their practical trade-offs. \u003c/li>\u003cli>Strong architectural capability, with experience shaping engineering design for complex enterprise applications. \u003c/li>\u003cli>Practical experience with cloud MLOps and the deployment and operation of machine-learning models in cloud environments. \u003c/li>\u003cli>Knowledge of data strategy and governance considerations, including data flows and data residency. \u003c/li>\u003cli>Experience evaluating the commercial and technical cost of AI models and services, including different consumption and licensing approaches. \u003c/li>\u003cli>The technical depth to engage credibly with engineers and architects, combined with the ability to articulate strategy to senior stakeholders. \u003c/li>\u003cli>Demonstrated cross-functional leadership and stakeholder management across Product, Engineering and executive groups. \u003c/li>\u003cli>Experience building or developing specialist technical teams and creating capability in a changing organisation. \u003c/li>\u003c/ul>\u003cbr/>\u003cp>\u003cb>Desirable experience:\u003c/b>\u003c/p>\u003cbr/>\u003cul>\u003cli>Experience in financial services, fintech, banking technology or core banking platforms. \u003c/li>\u003cli>Experience delivering AI capabilities within a structured, enterprise-scale software development environment. \u003c/li>\u003cli>Exposure to customer-facing enterprise applications where security, resilience, regulatory requirements and cost control are important design considerations. \u003c/li>\u003c/ul>\u003cbr/>\u003cp>\u003cb>Leadership profile \u003c/b>\u003c/p>\u003cbr/>\u003cp>You are an engineering-led AI leader rather than a purely product or research-focused specialist. You combine technical authority with sound judgement, can move comfortably between strategy and implementation detail, and communicate complex decisions with clarity. You build trust across organisational boundaries, challenge constructively and create the conditions for teams to turn emerging AI capabilities into dependable enterprise solutions.  \u003c/p>\u003cbr/>\u003cp>We are proud to offer a range of incentives to our employees worldwide. These benefits are available to everyone, regardless of grade, and reflect the values we stand for:\u003c/p>\u003cp>\u003cb>Flexibility: \u003c/b>Enjoy unlimited vacation, subject to local regulations and business priorities. Benefit from hybrid working arrangements and inclusive policies such as paid time off for voting, bereavement, and sick leave.\u003c/p>\u003cp>\u003cb>Well‑being: \u003c/b>Access confidential one‑to‑one support through our Employee Assistance Program, connect with our network of Wellbeing Champions and Gather Groups, and take part in monthly events and initiatives designed to help you thrive—inside and outside of work.\u003c/p>\u003cp>\u003cb>Health &amp; Financial Security: \u003c/b>Medical, life and disability insurance, retirement plans, lifestyle, and other benefits.*\u003c/p>\u003cp>\u003cb>Sustainability: \u003c/b>Paid time off for volunteering and donation‑matching opportunities to support causes that matter to you.\u003c/p>\u003cp>\u003cb>Inclusion:\u003c/b> Get involved in our inclusion communities, such as Count Me In, Culture@Finastra, Proud@Finastra, Disabilities@Finastra, and Women@Finastra—open to everyone who wants to participate and contribute.\u003c/p>\u003cp>\u003cb>Career Development:\u003c/b> Access online learning and accredited courses through our Skills &amp; Career Navigator tool.\u003c/p>\u003cp>\u003cb>Recognition: \u003c/b>Take part in our global recognition program, Finastra Celebrates, and share your voice through regular employee surveys that help shape our culture and ways of working.\u003c/p>\u003cp>*Specific benefits may vary by location.\u003c/p>\u003cp>At Finastra, each individual is unique—bringing their own ideas, perspectives, cultural backgrounds, and experiences. We learn from one another, value what makes us different, and create an environment where everyone feels included, supported, and able to be their authentic selves.\u003c/p>\u003cp>Be unique. Be exceptional. Help us make a difference at Finastra.\u003c/p>","datePosted":"2026-11-04T23:14:00Z","validThrough":"2027-01-03T23:14:00.000Z","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"Finastra International Limited","sameAs":"https://www.finastra.com","logo":"https://cdn.huntukvisasponsors.com/finastra-international-limited-nw6ydhoa8qno.jpg"},"identifier":{"@type":"PropertyValue","name":"Finastra International Limited","value":"director-ai-machine-learning-d3t5voe8s90n"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"London","addressCountry":"GB"}},"directApply":false}</script>
