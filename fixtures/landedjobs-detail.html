<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Senior Account Manager","description":"**About Us**\nHiBob is a global SaaS company helping modern businesses transform how they manage and develop their people. Behind Bob is a high-performing global go-to-market team, and APJ is a key part of our growth story.\n\nOur modular platform supports the full employee lifecycle - from hiring and onboarding to performance, compensation and workforce planning. For our sales team, that means opportunities to solve meaningful business challenges and build relationships across HR, Finance and executive leadership.\n\nHiBob recently secured a US$166 million investment led by Salesforce, supporting our vision to bring trusted people context into the AI-powered enterprise. It’s an exciting time to join as we accelerate our product and AI roadmap.\n\n**About the Role**\nAs a Senior Account Manager within HiBob’s Sub-Enterprise team,  you’ll play a pivotal role in expanding our footprint within client organisations by strategically positioning the value of our suite of products.\n\nYou’ll collaborate with Customer Success Managers and Renewal Managers to ensure a seamless client experience, with a primary focus of unlocking revenue potential and driving client success through consultative selling. \n\n## Responsibilities\n\nSales Expertise: Proven track record in delivering revenue through upselling in a SaaS/B2B environment.\n\n- Hands-on experience using the MEDDPICC framework to navigate and close complex sales cycles is essential, with MEDDPICC certification preferred.\n- 360 Sales Experience: Preferably experience in both new business acquisition and managing existing accounts.\n- Data-Driven and Goal-Oriented: Ability to forecast accurately, analyse performance, and hit targets.\n- Stakeholder Collaboration: Strong interpersonal skills to partner effectively with Customer Success and Renewal teams.\n- Consultative Approach: Exceptional ability to uncover client’s pain points and align their needs with product offerings, ensuring value-driven sales.\n- Experience managing an EMEA book of business with KPIs centered on expansions: upsells\n- Experience accurately forecasting and achieving revenue targets in a SaaS or similar environment\n- Familiarity with Salesforce\n- Experience selling HR technology and conducting value-led product demonstrations\n\n## Requirements\n\n- Revenue Growth: Identify upsell opportunities, delivering new ARR within existing accounts.\n- Strategic Sales Execution: Leverage the MEDDPICC framework to manage complex sales cycles and close deals effectively.\n- Relationship Management: Build strong, consultative relationships with clients to deeply understand their goals and position HiBob solutions as integral to their success.\n- Collaboration: Work closely with Customer Success, Renewal Managers and Sales Engineers to align on client needs and identify growth opportunities\n- Pipeline Management: Proactively build, manage, and forecast a robust pipeline of opportunities within assigned accounts.\n- Target Achievement: Consistently meet or exceed revenue targets and KPIs related to upsell.\n\n## Benefits\n\nHiBob is a village filled with amazing people and we’re especially proud of that. It’s a place where Bobbers can be themselves. We’re about fun, dreams, hopes and ambition, just as much as we are about precision, growth, and top performance. Becoming a Bobber means you’ll receive competitive compensation, benefits, and pre-IPO equity alongside all of this:\n\n- Company share options plan - every employee can eventually become a shareholder\n- Cash allowance for health insurance & wellbeing\n- Annual vision allowance\n- Annual UnMind subscription with wellness benefits including coaching and therapy sessions\n- Travel support (cycle scheme and season ticket loans)\n- Hybrid working from day 1\n- Work from home allowance - to get your home office set up!\n- Temporary remote work from anywhere in the world for up to 2 months per year (after 6 months of employment)\n- Bob balance days - Enjoy a company-wide long weekend at the beginning of each quarter\n- 2 Social Impact days per year for volunteering\n- Awesome employee referral program- $2,500 for each successful referral with an additional ambassador programme\n- Pension scheme auto-enrolment from day 1\n- Fun company and team social events (locally and virtually with our global teams)\n- We love birthdays - take the day off and receive a special gift\n\n**Belonging at HiBob**\nOur success depends on our people, and we want HiBob to be a workplace where everyone can feel a sense of belonging and thrive, so we’re committed to being proactive at all levels so that our workforce reflects the communities in which we live, work, and hire.\n\nWe are open to all talent. All qualified applicants will receive equal consideration for employment without regard to neurodiversity, race/ethnicity, colour, national origin, religion, gender, pregnancy, marital status, sexual orientation, gender identity/expression, age, disability, genetic information, military service, covered/protected veteran status or any other federal, state or local protected class*(*US only).\n\nPlease contact us if you’d like to discuss any adjustments to our process which might help you demonstrate your strengths and capabilities. We want you to bring the best of you. You can email hiring@hibob.io or speak to the recruiter when they arrange a call with you.\n\nWe will ask you to share some voluntary personal information as you apply. We want to have an opportunity to consider a diverse pool of qualified candidates. This information will assist us in meeting that objective and in understanding how well we are doing against our inclusion and diversity ambitions. Hiring Managers do not have access to this information, and we will treat your information confidentially.","identifier":{"@type":"PropertyValue","name":"Hibob","value":"045dc146-aece-4cb4-8002-bb0293c83b3d"},"datePosted":"2026-11-03","validThrough":"2027-01-02T00:00:00.000Z","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","name":"Hibob","sameAs":"https://hibob.com"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"UK"}},"directApply":false,"url":"https://www.landed.jobs/jobs/045dc146-aece-4cb4-8002-bb0293c83b3d"}</script>
