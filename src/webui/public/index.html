<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SponsorScout</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>SponsorScout</h1>
    <div class="actions">
      <label class="checkbox"><input type="checkbox" id="includeSponsors"> also refresh sponsor register</label>
      <button id="refreshBtn">Refresh now</button>
    </div>
  </header>

  <div id="progress" class="progress hidden">
    <div class="spinner"></div>
    <span id="progressText">Working...</span>
  </div>

  <section id="sourceHealth" class="source-health"></section>

  <section class="filters">
    <input id="search" type="search" placeholder="Search title or employer...">
    <select id="filterCategory">
      <option value="">Source: any</option>
    </select>
    <select id="filterSource">
      <option value="">Company: any</option>
    </select>
    <select id="filterPostedSince">
      <option value="">Posted: any time</option>
      <option value="24h">Last 24 hours</option>
      <option value="1w">Last week</option>
      <option value="2w">Last 2 weeks</option>
      <option value="1m">Last month</option>
      <option value="3m">Last 3 months</option>
      <option value="6m">Last 6 months</option>
      <option value="1y">Last year</option>
    </select>
    <select id="filterSponsorStatus">
      <option value="">Sponsor: any</option>
      <option value="likely">Sponsor: likely</option>
      <option value="unclear">Sponsor: unclear</option>
      <option value="no">Sponsor: no</option>
    </select>
    <select id="filterSalaryClass">
      <option value="">Salary: any</option>
      <option value="strong">Salary: strong</option>
      <option value="borderline">Salary: borderline</option>
      <option value="unknown">Salary: unknown</option>
      <option value="below">Salary: below</option>
    </select>
    <select id="filterRemoteType">
      <option value="">Remote: any</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
      <option value="onsite">Onsite</option>
      <option value="unknown">Unknown</option>
    </select>
    <select id="filterStatus">
      <option value="">Triage: any</option>
      <option value="new">New</option>
      <option value="applied">Applied</option>
      <option value="ignored">Ignored</option>
    </select>
    <label class="checkbox"><input type="checkbox" id="hideExcluded" checked> hide excluded</label>
  </section>

  <main id="jobList"></main>

  <nav id="pagination" class="pagination hidden">
    <button id="prevPageBtn" class="secondary">&laquo; Prev</button>
    <span id="pageInfo"></span>
    <button id="nextPageBtn" class="secondary">Next &raquo;</button>
  </nav>

  <div id="generateModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="generateModalTitle">Generate CV + cover letter</h3>
        <button id="closeGenerateModal" class="secondary">&times;</button>
      </div>
      <div id="generateModalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
